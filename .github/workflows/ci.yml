name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test and packaging tools
        run: |
          python -m pip install --upgrade pip PyYAML
          sudo apt-get update
          sudo apt-get install --yes build-essential shellcheck debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools python3-yaml
      - name: Run unit and shell checks
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m compileall -q src
          sh -n install.sh manager-update.sh update.sh uninstall.sh
          bash -n scripts/proxmox-install.sh scripts/proxmox-manage.sh scripts/mesh-radio-menu
          shellcheck install.sh manager-update.sh update.sh uninstall.sh scripts/*.sh debian/mesh-radio-manager.postinst debian/mesh-radio-manager.prerm debian/tests/smoke
      - name: Build Debian package
        run: |
          chmod 0755 debian/rules debian/tests/smoke
          dpkg-buildpackage -us -uc -b
          dpkg-deb --info ../mesh-radio-manager_*_all.deb
